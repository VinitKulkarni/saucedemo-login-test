name: Daily SauceDemo Login Test

on:
  schedule:
    - cron: '11 7 * * *'

  workflow_dispatch:

jobs:
  test:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Run SauceDemo Login Test
        run: mvn test
